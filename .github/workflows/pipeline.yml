
name: Pipeline CI/CD Calculatrice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (style du code)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Flake8
        run: python -m pip install flake8

      - name: Vérifier le style du code
        run: python -m flake8 calculatrice.py test_calculatrice.py --max-line-length=100

  test:
    name: Tests automatiques
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Installer pytest
        run: python -m pip install pytest

      - name: Exécuter les tests
        run: python -m pytest -v

  build:
    name: Construction du paquet
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le paquet
        run: |
          mkdir -p dist
          cp calculatrice.py dist/

      - name: Enregistrer le paquet
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-paquet
          path: dist/

  deploy:
    name: Déploiement (simulé)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Télécharger le paquet
        uses: actions/download-artifact@v4
        with:
          name: calculatrice-paquet
          path: dist/

      - name: Vérifier le paquet
        run: ls -l dist/

      - name: Simuler le déploiement
        run: echo "Application déployée avec succès !"
